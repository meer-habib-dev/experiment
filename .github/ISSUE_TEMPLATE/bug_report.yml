name: Bug report
description: Report reproducible behavior in an existing experiment
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: experiment
    attributes:
      label: Experiment
      options:
        - Gallery or routing
        - Sign Off
        - Field Folio
        - Halo Arena
        - Timberline
        - Prism Field
        - Relic Lift
        - Rain Lens
        - Volcano Drive
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, OS version, and Expo Go or development build.
      placeholder: iPhone 16 Pro, iOS 26, local development build
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or recording
      description: Remove credentials and personal data before attaching anything.
